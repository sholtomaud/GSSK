name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  # ────────────────────────────────────────────────────────────
  # Build matrix: gcc + clang × Linux + macOS
  # Parallel across compiler/OS combinations.
  # ────────────────────────────────────────────────────────────
  build-native:
    name: Build & test (${{ matrix.cc }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc   }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: Build
        run: make all

      - name: Run regression tests
        run: make test

  # ────────────────────────────────────────────────────────────
  # Quality gate — all Linux-only checks as serial steps.
  # One checkout, one apt-get, one runner.
  # ────────────────────────────────────────────────────────────
  quality:
    name: Quality gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang valgrind lcov python3

      - name: ASan + UBSan — build
        env:
          CC: clang
        run: make asan

      - name: ASan + UBSan — run tests
        env:
          CC: clang
        run: make test-asan

      - name: Coverage — build
        run: make coverage-build

      - name: Coverage — generate report
        run: |
          make coverage-report
          echo "## Coverage summary" >> $GITHUB_STEP_SUMMARY
          lcov --summary coverage/lcov.info >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Coverage — enforce ≥ 85% line
        run: make coverage-check

      - name: Coverage — upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/

      - name: Valgrind — build (debug)
        run: make DEBUG=1 all

      - name: Valgrind — run tests
        run: make test-valgrind

      - name: Fuzz — build target
        env:
          CC: clang
        run: make fuzz-build

      - name: Fuzz — short run (30 seconds)
        env:
          CC: clang
        run: make fuzz-run FUZZ_TIMEOUT=30

      - name: Perf — build (optimised)
        run: make all

      - name: Perf — benchmark regression check
        run: make bench-check

  # ────────────────────────────────────────────────────────────
  # Swift package (macOS) — separate job, different OS.
  # ────────────────────────────────────────────────────────────
  swift:
    name: Swift (6.0, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        run: make swift-build

      - name: Run Swift tests
        run: make swift-test

  # ────────────────────────────────────────────────────────────
  # Deploy — only on push to main or version tags.
  # Requires all test jobs to pass first.
  # ────────────────────────────────────────────────────────────
  deploy:
    needs: [ build-native, quality, swift ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build native
        run: make all

      - name: Build WASM
        run: make wasm

      - name: Build documentation
        run: |
          npm install
          npm run docs:build

      - name: Deploy to distribution branch
        run: |
          mkdir -p tmp_dist
          cp -r dist tmp_dist/
          cp -r include tmp_dist/
          cp README.md tmp_dist/
          cp package.json tmp_dist/
          cd tmp_dist
          git init -b dist
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "chore: distribution build [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git dist --force
          if [[ ${{ github.ref }} == refs/tags/* ]]; then
            git tag ${{ github.ref_name }}
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }} --force
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p public/demo
          cp -r docs/.vitepress/dist/* public/
          cp web/index.html public/demo/
          cp web/favicon.png public/demo/
          cp dist/gssk.js public/demo/
          cp dist/gssk.wasm public/demo/
          touch public/.nojekyll
          sed -i 's|../dist/gssk.js|gssk.js|' public/demo/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/gssk
            lib/libgssk.a
            include/gssk.h
            dist/gssk.js
            dist/gssk.wasm
            dist/gssk.d.ts
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest (rolling)"
          body: |
            Automated pre-release from the tip of `main`.
            Commit: ${{ github.sha }}
          files: |
            bin/gssk
            lib/libgssk.a
            include/gssk.h
            dist/gssk.js
            dist/gssk.wasm
            dist/gssk.d.ts
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
